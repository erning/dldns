name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Shell scripts
        run: |
          shellcheck -s dash \
            dldns \
            tests/test-dldns-ip.sh \
            tests/test-dldns-sync.sh \
            tests/test-dldns-update.sh \
            tests/mocks/curl \
            tests/mocks/dig \
            tests/mocks/functions.sh \
            tests/mocks/notify \
            tests/mocks/ubus

      - name: Test
        run: |
          tests/test-dldns-ip.sh
          tests/test-dldns-update.sh
          tests/test-dldns-sync.sh

      - name: Generate checksum
        run: sha256sum dldns > dldns.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dldns
            dldns.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
