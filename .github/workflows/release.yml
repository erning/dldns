name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate checksum
        run: sha256sum dldns > dldns.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dldns
            dldns.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
